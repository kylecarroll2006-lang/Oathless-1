<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no"><title>Oathless</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Spectral:wght@400;600&family=Uncial+Antiqua&display=swap">
<style>
/* Layout: a war-table. Board on the left, party and orders on the right; map/shop/rewards replace the board. */
:root{--ground:#12131a;--panel:#1b1d27;--panel2:#232634;--edge:#333749;--bone:#e8e1cf;--dim:#9a968a;--ox:#b3432f;--oxh:#cf5a43;--gold:#d6ad52;--ash:#6d97ad;--hp:#7fb069;--bad:#d9604a;
 --display:'Uncial Antiqua','Palatino Linotype',Georgia,serif;--body:'Spectral',Georgia,'Times New Roman',serif;color-scheme:dark}
*{box-sizing:border-box}
html,body{margin:0;background:var(--ground);color:var(--bone);font-family:var(--body);font-size:15px;line-height:1.45}
body{background:var(--ground)}
#app{max-width:1180px;margin:0 auto;padding-block:14px 40px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
h1,h2,h3{font-family:var(--display);font-weight:400;margin:0;letter-spacing:.02em;text-wrap:balance}
h1{font-size:30px;color:var(--bone)} h2{font-size:21px} h3{font-size:16px;color:var(--gold)}
.top{display:flex;align-items:baseline;justify-content:space-between;gap:12px;flex-wrap:wrap;border-bottom:1px solid var(--edge);padding-bottom:10px;margin-bottom:14px}
.top small{color:var(--dim)}
.btn{font:inherit;background:var(--panel2);color:var(--bone);border:1px solid var(--edge);padding:7px 12px;border-radius:3px;cursor:pointer;min-height:36px}
.btn:hover:not(:disabled){border-color:var(--gold)} .btn:disabled{opacity:.4;cursor:not-allowed}
.btn:focus-visible,input:focus-visible,select:focus-visible,canvas:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
.btn.primary{background:var(--ox);border-color:var(--oxh);color:#fff6ea} .btn.primary:hover:not(:disabled){background:var(--oxh)}
.btn.sel{border-color:var(--gold);box-shadow:inset 0 0 0 1px var(--gold)}
input,select{font:inherit;background:var(--ground);color:var(--bone);border:1px solid var(--edge);padding:7px 10px;border-radius:3px;min-height:36px;max-width:100%}
.panel{background:var(--panel);border:1px solid var(--edge);border-radius:4px;padding:14px}
.grid{display:grid;gap:12px}.g2{grid-template-columns:repeat(auto-fit,minmax(280px,1fr))}.g3{grid-template-columns:repeat(auto-fit,minmax(200px,1fr))}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}.sp{justify-content:space-between}
.dim{color:var(--dim)}.gold{color:var(--gold)}.bad{color:var(--bad)}
.stage{display:grid;grid-template-columns:minmax(0,1fr) 340px;gap:14px;align-items:start}
@media(max-width:900px){.stage{grid-template-columns:minmax(0,1fr)}}
.boardwrap{position:relative;background:#0c0d12;border:1px solid var(--edge);border-radius:4px;padding:6px}
canvas{display:block;width:100%;height:auto;touch-action:manipulation;cursor:crosshair}
#tip{position:absolute;left:10px;bottom:10px;max-width:70%;background:rgba(12,13,18,.92);border:1px solid var(--edge);padding:6px 9px;font-size:13px;pointer-events:none;display:none;border-radius:3px}
.hud{display:flex;gap:14px;flex-wrap:wrap;align-items:center;margin-bottom:10px}
.meter{flex:1;min-width:180px}.bar{height:8px;background:var(--ground);border:1px solid var(--edge);border-radius:2px;overflow:hidden}
.bar>i{display:block;height:100%;background:var(--hp)} .bar.ult>i{background:var(--gold)} .bar.xp>i{background:var(--ash)}
.hero{display:grid;gap:4px;padding:8px;border:1px solid var(--edge);border-left:4px solid var(--c,#888);background:var(--panel);border-radius:3px;cursor:pointer}
.hero.on{background:var(--panel2);border-color:var(--gold);border-left-color:var(--c)} .hero.dead{opacity:.45}
.pips{display:flex;gap:3px}.pip{width:9px;height:9px;border-radius:50%;background:var(--gold)}.pip.off{background:var(--edge)}
.tag{display:inline-block;font-size:12px;padding:0 6px;border:1px solid var(--edge);border-radius:2px;color:var(--dim);margin-right:3px}
.abs{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:6px}
.ab{text-align:left;display:grid;gap:1px;padding:6px 8px;line-height:1.25}.ab b{font-weight:600;font-size:14px}.ab span{font-size:12px;color:var(--dim)}
.ab.ult{border-color:var(--gold)} .ab.ult.ready{box-shadow:0 0 0 1px var(--gold),0 0 12px rgba(214,173,82,.4)}
#log{max-height:150px;overflow:auto;font-size:13px;color:var(--dim);display:grid;gap:2px}
.card{background:var(--panel2);border:1px solid var(--edge);border-radius:4px;padding:12px;display:grid;gap:6px;align-content:start;text-align:left;font:inherit;color:inherit;cursor:pointer}
.card:hover:not(:disabled){border-color:var(--gold)} .card.sel{border-color:var(--gold);box-shadow:inset 0 0 0 1px var(--gold)} .card:disabled{opacity:.45;cursor:not-allowed}
.ctitle{font-family:var(--display);font-size:17px}
.plr{display:flex;align-items:center;gap:8px}.dot{width:9px;height:9px;border-radius:50%;background:var(--edge)}.dot.on{background:var(--hp)}
.mapnode{min-height:96px}.note{font-size:13px;color:var(--dim)}
.tabs{display:flex;gap:6px;flex-wrap:wrap}

/* ---- 3D battle layout ---- */
body{background:radial-gradient(1200px 600px at 50% -10%,#1d2030 0,var(--ground) 70%) fixed,var(--ground)}
body.ingame #app{max-width:none;padding-block:8px 14px}
body.ingame .top{margin-bottom:8px;padding-bottom:6px}body.ingame h1{font-size:20px}body.ingame .top small{display:none}
kbd{font-family:var(--body);font-size:11px;border:1px solid var(--edge);border-radius:3px;padding:0 5px;color:var(--dim);background:rgba(0,0,0,.35)}
.stage3d{position:relative;height:calc(100vh - 86px);min-height:560px;border:1px solid var(--edge);border-radius:4px;overflow:hidden;background:#0d0e13}
.stage3d canvas{position:absolute;inset:0;width:100%;height:100%;cursor:crosshair;outline:none}
#labels,#floats{position:absolute;inset:0;pointer-events:none;overflow:hidden}
.ulab{position:absolute;left:0;top:0;width:64px;text-align:center;pointer-events:none;will-change:transform}
.ulab .nm{font-size:11px;color:var(--bone);text-shadow:0 1px 2px #000,0 0 4px #000;white-space:nowrap;min-height:13px}
.ulab .hpb{height:6px;background:rgba(0,0,0,.7);border:1px solid rgba(0,0,0,.85);position:relative;margin:1px auto;border-radius:1px}
.ulab .hh{position:absolute;left:0;top:0;bottom:0;background:var(--hp)}.ulab.foe .hh{background:#c4503a}
.ulab .ss{position:absolute;left:0;bottom:0;height:2px;background:#7fb2ff}
.ulab.sel .hpb{border-color:var(--gold)}.ulab.boss{width:150px}.ulab.boss .hpb{height:9px}.ulab.boss .nm{font-family:var(--display);font-size:14px}
.sts b{display:inline-block;width:6px;height:6px;margin:1px;border-radius:50%}
.dmg{position:absolute;left:0;top:0;font-weight:600;font-size:20px;text-shadow:0 1px 3px #000,0 0 7px #000;white-space:nowrap}
#hud{position:absolute;top:0;left:0;right:0;display:flex;gap:34px;align-items:center;padding:10px 14px 22px;background:linear-gradient(rgba(10,11,16,.9),rgba(10,11,16,0))}
#hud .hl{display:grid}#hud .where{font-family:var(--display);font-weight:400;color:var(--gold);font-size:17px}
.charge{display:flex;align-items:center;gap:9px;flex:0 1 330px}.charge span{color:var(--dim);font-size:12px;text-transform:uppercase;letter-spacing:.08em}
.cbar{position:relative;flex:1;height:10px;background:#000;border:1px solid var(--edge);border-radius:2px}.cbar i{display:block;height:100%;background:linear-gradient(90deg,#9a7a2a,var(--gold))}
.cbar u{position:absolute;left:50%;top:-2px;bottom:-2px;width:1px;background:var(--bone);opacity:.6}
#hud .hr{margin-left:auto;display:flex;gap:12px;align-items:center;flex-wrap:wrap;justify-content:flex-end}
.relic{font-size:12px;border:1px solid var(--edge);padding:1px 7px;border-radius:2px;color:var(--bone);background:rgba(0,0,0,.35)}
#party{position:absolute;left:10px;top:64px;width:240px;display:grid;gap:6px}
.pc{display:flex;gap:9px;padding:7px 8px;background:rgba(17,18,25,.9);border:1px solid var(--edge);border-left:3px solid var(--c);border-radius:3px;cursor:pointer}
.pc:hover{border-color:var(--gold)}.pc.on{border-color:var(--gold);background:rgba(30,32,44,.95)}.pc.dead{opacity:.45}.pc.other{cursor:default}
.pg{width:36px;height:36px;border-radius:50%;border:2px solid var(--c);display:grid;place-items:center;font-family:var(--display);font-size:18px;color:var(--c);background:rgba(0,0,0,.4);flex:none}
.pi{flex:1;min-width:0;display:grid;gap:3px}.hpw{height:7px;background:#000;position:relative;border-radius:1px}.hpw i{display:block;height:100%;background:var(--hp)}.hpw u{position:absolute;left:0;bottom:0;height:3px;background:#7fb2ff}
.sts2{display:flex;flex-wrap:wrap}.sts2 .tag{font-size:11px}
#inspect{position:absolute;right:12px;top:64px;width:290px;background:rgba(17,18,25,.93);border:1px solid var(--edge);padding:10px;display:none;gap:5px;border-radius:3px}
#hint{position:absolute;left:50%;bottom:104px;transform:translateX(-50%);max-width:min(620px,calc(100% - 600px));text-align:center;font-size:13px;color:var(--dim);text-shadow:0 1px 3px #000;pointer-events:none}
#bar{position:absolute;left:260px;right:230px;bottom:12px;display:flex;gap:12px;justify-content:center;align-items:flex-end}
.bgrp{display:flex;gap:6px;flex-wrap:wrap;justify-content:center}.bgrp.main{flex:0 1 auto}
.kb{position:relative;background:rgba(17,18,25,.94);border:1px solid var(--edge);color:var(--bone);padding:7px 10px 6px;min-width:100px;display:grid;gap:0;cursor:pointer;text-align:left;font:inherit;border-radius:3px;line-height:1.25}
.kb b{font-weight:600;font-size:14px;padding-right:14px;white-space:nowrap}.kb span{font-size:12px;color:var(--dim)}.kb kbd{position:absolute;right:5px;top:4px}
.kb:hover:not(:disabled){border-color:var(--gold)}.kb.sel{border-color:var(--gold);background:rgba(44,40,26,.95);box-shadow:inset 0 0 0 1px var(--gold)}.kb:disabled{opacity:.4;cursor:not-allowed}
.kb.ult{border-color:#8a6f2a}.kb.ult.ready{box-shadow:0 0 0 1px var(--gold),0 0 14px rgba(214,173,82,.5)}
#endturn{position:absolute;right:12px;bottom:12px;display:grid;gap:8px;justify-items:end;width:200px}
.btn.big{font-size:17px;padding:11px 18px;width:100%;font-family:var(--display)}
#logbox{position:absolute;left:10px;bottom:12px;width:270px;max-height:200px;overflow:auto;background:rgba(17,18,25,.93);border:1px solid var(--edge);padding:8px 10px;font-size:13px;color:var(--dim);display:none;border-radius:3px;z-index:3}
#noGL{position:absolute;left:50%;top:40%;transform:translateX(-50%);z-index:5;max-width:420px}
@media(max-width:1100px){#bar{left:10px;right:10px;bottom:84px}#endturn{width:auto;bottom:12px;grid-auto-flow:column;align-items:center}#hint{display:none}#party{width:200px}}

/* ---- title / menus over a live 3D backdrop ---- */
#bgwrap{position:fixed;inset:0;z-index:0;background:#0b0c11}body:not(.inmenu) #bgwrap{display:none}#app{position:relative;z-index:1}
#bgwrap::after{content:'';position:absolute;inset:0;pointer-events:none;background:radial-gradient(ellipse at 65% 55%,transparent 35%,rgba(4,5,8,.78) 100%),linear-gradient(90deg,rgba(5,6,9,.88) 0,rgba(5,6,9,.4) 34%,transparent 60%)}
.stage3d.asbg{position:absolute;inset:0;height:100%;min-height:0;border:0;border-radius:0}
.asbg>*:not(canvas){display:none!important}.asbg canvas{cursor:grab}
body.inmenu #app{max-width:none;padding:0;position:relative;z-index:1}body.inmenu .top{display:none}
#menu,#room{min-height:100vh;pointer-events:none;padding:4vh max(4vw,env(safe-area-inset-left,0px))}
#menu .pa,#room .pa{pointer-events:auto}
.title{display:grid;grid-template-columns:minmax(300px,420px) minmax(0,1fr);gap:3vw;align-items:start;min-height:92vh}
.logo{font-family:var(--display);font-size:clamp(44px,6.4vw,84px);line-height:.95;letter-spacing:.04em;color:var(--bone);text-shadow:0 2px 0 #000,0 0 40px rgba(179,67,47,.55);margin:6vh 0 4px}
.logo i{font-style:normal;color:var(--oxh)}
.tag2{color:var(--dim);letter-spacing:.2em;text-transform:uppercase;font-size:12px;margin-bottom:34px}
.mlist{display:grid;gap:4px;max-width:340px}
.mbtn{font-family:var(--display);font-size:20px;text-align:left;background:linear-gradient(90deg,rgba(24,26,36,.9),rgba(24,26,36,.35));color:var(--bone);border:0;border-left:3px solid transparent;padding:11px 16px;cursor:pointer;transition:all .12s;min-height:44px}
.mbtn:hover:not(:disabled),.mbtn.on{border-left-color:var(--gold);background:linear-gradient(90deg,rgba(60,50,28,.9),rgba(24,26,36,.4));padding-left:24px;color:#fff3d0}
.mbtn:disabled{opacity:.4;cursor:not-allowed}.mbtn small{display:block;font-family:var(--body);font-size:12px;color:var(--dim);letter-spacing:0}
.foot{position:fixed;left:max(4vw,16px);bottom:14px;font-size:12px;color:var(--dim);pointer-events:none}
.sheet{background:rgba(16,17,24,.94);border:1px solid var(--edge);border-top:2px solid var(--gold);border-radius:3px;padding:20px 22px;display:grid;gap:14px;max-width:620px;justify-self:end;width:100%;backdrop-filter:blur(3px);max-height:88vh;overflow:auto}
.sheet h2{font-size:26px}.sheet .x{position:absolute;right:12px;top:8px}
.seg{display:flex;flex-wrap:wrap;gap:6px}.seg .btn{flex:1;min-width:92px;text-align:center}
.fld{display:grid;gap:5px}.fld>label,.lbl{font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:var(--dim)}
.setrow{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:9px 0;border-bottom:1px solid var(--edge)}
.tog{width:46px;height:24px;border-radius:12px;background:var(--edge);border:0;position:relative;cursor:pointer;flex:none}.tog::after{content:'';position:absolute;left:3px;top:3px;width:18px;height:18px;border-radius:50%;background:var(--bone);transition:left .12s}
.tog.on{background:var(--ox)}.tog.on::after{left:25px}
input[type=range]{min-height:0;padding:0;accent-color:var(--gold);width:150px}
.keys{display:grid;grid-template-columns:auto 1fr;gap:6px 14px;font-size:14px}
/* hero select */
.pick{display:grid;grid-template-columns:minmax(0,1fr) minmax(320px,430px);gap:3vw;min-height:92vh;align-items:stretch}
.pick .lt{display:grid;grid-template-rows:auto 1fr auto;gap:12px;min-height:88vh}
.pick h2{font-size:30px;text-shadow:0 2px 6px #000}
.slots{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}
.slot{background:rgba(16,17,24,.85);border:1px solid var(--edge);border-bottom:3px solid var(--c,var(--edge));padding:7px 14px;color:var(--bone);font:inherit;cursor:pointer;min-height:40px}
.slot.on{border-color:var(--gold);border-bottom-color:var(--c);background:rgba(44,40,26,.92)}
.roster{display:flex;gap:8px;flex-wrap:wrap;align-items:end;justify-content:center}
.rc{width:104px;background:rgba(16,17,24,.9);border:1px solid var(--edge);border-bottom:3px solid var(--c);padding:8px 6px;display:grid;justify-items:center;gap:3px;cursor:pointer;color:var(--bone);font:inherit;transition:transform .1s}
.rc:hover{transform:translateY(-3px);border-color:var(--gold)}.rc.on{border-color:var(--gold);background:rgba(50,44,26,.95);transform:translateY(-6px)}
.rc .pg{width:46px;height:46px;font-size:24px}.rc b{font-family:var(--display);font-weight:400;font-size:14px}.rc span{font-size:11px;color:var(--dim)}
.info{background:rgba(16,17,24,.94);border:1px solid var(--edge);border-top:2px solid var(--c,var(--gold));padding:18px 20px;display:grid;gap:12px;align-content:start;max-height:92vh;overflow:auto}
.info h2{color:var(--c)}.stat{display:grid;grid-template-columns:50px 1fr 34px;gap:8px;align-items:center;font-size:13px}.stat .bar{height:7px}
.stat .bar i{background:var(--c,var(--gold))}
.abl{display:grid;grid-template-columns:34px 1fr;gap:9px;align-items:start;padding:5px 0;border-top:1px solid rgba(255,255,255,.05)}
.abl .ic{width:34px;height:34px;border:1px solid var(--edge);display:grid;place-items:center;font-family:var(--display);color:var(--gold);background:#0c0d12;font-size:15px}
.abl.ult .ic{border-color:var(--gold);box-shadow:0 0 8px rgba(214,173,82,.4)}.abl b{font-size:14px}.abl div div{font-size:12px;color:var(--dim)}
.lobby{background:rgba(16,17,24,.9);border:1px solid var(--edge);padding:12px 14px;display:grid;gap:8px;max-width:420px}
/* path map */
.mapwrap{position:relative;background:radial-gradient(ellipse at 50% 40%,#2a2116,#0d0e14 85%);border:1px solid var(--edge);border-radius:4px;padding:10px 6px;overflow:hidden}.mapwrap svg{filter:drop-shadow(0 10px 18px rgba(0,0,0,.6))}
.mapwrap svg{width:100%;height:auto;display:block;max-height:52vh}
.mapnode2{cursor:pointer}.mapnode2.dis{cursor:default}
.mapttl{display:flex;justify-content:space-between;align-items:baseline;flex-wrap:wrap;gap:8px;padding:2px 12px 6px}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:12px;color:var(--dim);padding:6px 12px}
@keyframes pulse{0%,100%{opacity:.35}50%{opacity:1}}.pulse{animation:pulse 1.6s infinite}
.modal{position:fixed;inset:0;z-index:50;background:rgba(0,0,0,.6);display:grid;place-items:center;padding:16px}
@media(max-width:900px){.title,.pick{grid-template-columns:1fr}.sheet{justify-self:stretch}}
#flash{position:absolute;inset:0;pointer-events:none;opacity:0;z-index:3;mix-blend-mode:screen}
#banner{position:absolute;left:0;right:0;top:20%;text-align:center;pointer-events:none;opacity:0;z-index:4;display:grid;gap:4px}
#banner b{font-family:var(--display);font-weight:400;font-size:clamp(34px,5vw,68px);letter-spacing:.08em;color:#fff3d0;text-shadow:0 0 30px rgba(214,173,82,.8),0 3px 0 #000}
#banner small{letter-spacing:.35em;text-transform:uppercase;color:var(--gold);font-size:13px;text-shadow:0 1px 3px #000}
#banner.show{animation:bn var(--ms,2400ms) ease-out forwards}
#banner.boss b{color:#ffb09a;text-shadow:0 0 36px rgba(207,90,67,.9),0 3px 0 #000}
@keyframes bn{0%{opacity:0;transform:scale(1.25);letter-spacing:.3em}12%{opacity:1;transform:scale(1)}78%{opacity:1}100%{opacity:0;transform:scale(.97)}}
.stage3d::after{content:'';position:absolute;inset:0;pointer-events:none;background:radial-gradient(ellipse at center,transparent 55%,rgba(0,0,0,.55) 100%);z-index:1}
.asbg::after{display:none}#hud,#party,#inspect,#hint,#bar,#endturn,#logbox{z-index:2}
#p2pbox{position:fixed;left:12px;bottom:12px;z-index:30;width:min(320px,calc(100vw - 24px));display:grid;gap:8px;max-height:70vh;overflow:auto}#p2pbox .phd{display:flex;justify-content:space-between;align-items:center}#p2pbox textarea{width:100%;font:12px monospace;background:#0d0e14;color:#e8e1cf;border:1px solid var(--edge);border-radius:3px;padding:6px;box-sizing:border-box}#p2pbox #pbody{display:grid;gap:8px}#p2pbox [hidden]{display:none!important}
#dlg{position:fixed;inset:0;z-index:60;display:flex;align-items:flex-end;justify-content:center;padding:0 12px 18px;background:linear-gradient(transparent 40%,rgba(0,0,0,.55))}#dlg[hidden]{display:none}
#dlg .dbox{position:relative;width:min(820px,100%);display:grid;grid-template-columns:84px 1fr;gap:16px;align-items:center;border-top:2px solid var(--gold);padding:18px 20px 34px;cursor:pointer;background:rgba(14,15,22,.96)}
#dlg .dpor{width:76px;height:76px;border-radius:50%;border:2px solid var(--c,#d6ad52);display:grid;place-items:center;font-size:36px;color:var(--c,#d6ad52);background:radial-gradient(#262a3a,#10111a);box-shadow:0 0 18px color-mix(in srgb,var(--c,#d6ad52) 45%,transparent)}
#dlg .dtx b{font-family:'Uncial Antiqua',serif;font-size:18px;letter-spacing:.04em}#dlg .dtx p{margin:6px 0 0;font-size:18px;line-height:1.5;min-height:3em;font-family:Georgia,serif}
#dlg .dhint{position:absolute;right:12px;bottom:6px;display:flex;gap:10px;align-items:center}

.resv.lose .resh{color:#d9604a;text-shadow:0 3px 0 #000,0 0 26px rgba(217,96,74,.5)}.resv.abn .resh{color:#b3a283}.ressub{color:var(--dim);font-style:italic;margin:2px 0 8px}
.resgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(110px,1fr));gap:6px}.rst{display:grid;justify-items:center;gap:1px;padding:8px 4px;border:1px solid #5a4430;background:rgba(0,0,0,.28)}.rst span{color:var(--gold);font-size:20px}.rst b{font:400 22px var(--display);color:#f1e2bd}.rst i{font-size:11px;color:var(--dim);font-style:normal;letter-spacing:.1em;text-transform:uppercase}
.resheroes{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:8px}.rhero{display:flex;gap:10px;padding:8px;border:1px solid #5a4430;border-left:3px solid var(--c);background:rgba(0,0,0,.28)}.rhi{display:grid;gap:3px;font-size:13px;min-width:0}.rhi i{color:var(--gold);font-size:12px}.rg{display:flex;gap:4px;flex-wrap:wrap;align-items:center}.rg .sep{width:1px;height:22px;background:#6a5035;margin:0 3px}
/* iPhone 17 Pro Max fit (440x956 pt) */
:root{--sl:env(safe-area-inset-left,0px);--sr:env(safe-area-inset-right,0px);--st:env(safe-area-inset-top,0px);--sb:env(safe-area-inset-bottom,0px)}
html,body{height:100dvh;overscroll-behavior:none;-webkit-text-size-adjust:100%;touch-action:manipulation}
body{padding:var(--st) var(--sr) var(--sb) var(--sl)}
.btn,.card,.slot,.rc,kbd{-webkit-tap-highlight-color:transparent}
.btn{min-height:44px}
@media(orientation:landscape) and (max-height:480px){
 body{font-size:14px}
 .btn{min-height:38px;padding:5px 10px}
 .title{grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:2vw}.title h1{font-size:clamp(34px,9vh,56px)}
 .mbtn{font-size:15px;padding:6px 12px}.mbtn small{font-size:10px}.foot{display:none}
 #menu .sheet{padding:8px}#menu .sheet>div,.title .menu{gap:4px}
 .title>div:last-child{min-height:0!important}
 #hud{padding:5px 10px 12px;gap:14px}#hud .where{font-size:14px}
 #party{transform:scale(.62);transform-origin:top left;top:46px;left:4px}
 #bar{transform:scale(.66);transform-origin:bottom center;bottom:4px;left:12%;right:12%}
 #order{transform:scale(.7);transform-origin:top center;top:30px}
 #endturn{transform:scale(.72);transform-origin:bottom right;bottom:2px;right:2px}
 #bpfab{transform:scale(.7);transform-origin:bottom left;left:4px;bottom:4px}
 #hud{transform:scale(.8);transform-origin:top left;width:125%}
 .sheet{max-height:88vh;overflow:auto;padding:12px 14px}.panel{padding:10px 12px}
 #dlg .box{max-height:60vh}
 .bwrap{padding:4px 8px}
 .stage3d{height:calc(100dvh - 34px - var(--st) - var(--sb));min-height:0}
 body.ingame #app{padding:2px 6px}body.ingame .top{display:none}
 #logbox{display:none}
}
@media(orientation:portrait){body{font-size:15px}.title{grid-template-columns:1fr}}
@media(orientation:portrait){
 body.ingame::after{content:"↻  Rotate your phone sideways to play";position:fixed;inset:0;z-index:999;display:grid;place-items:center;text-align:center;padding:30px;font:22px var(--display);color:var(--gold);background:rgba(12,8,4,.96)}
}

/* ----- units ----- */
function mkHeroUnit(S,h,x,y){

    armor:st.armor,atk:st.atk,mv:st.mv,rng:1,st:{},sh:st.sh,ap:3,mvl:st.mv,ult:false,dead:false,abs:h.abs.slice(),thorns:st.thorns,steal:st.steal,gain:st.gain,onhit:st.onhit};

function mkEnemy(S,type,x,y,id,affix){
  const d=EN[type]||BOSS[type], df=DIFF[S.diff], dep=S.mode==='arena'?S.wave:S.depth;

    mv:d.mv,rng:d.rng,ai:d.ai,spec:d.spec,st:{},sh:0,ap:1,mvl:d.mv,dead:false,xp:d.xp,hit:d.hit?d.hit.slice():null,pierce:d.pierce,boss:!!d.spec,thorns:0,steal:0,aff:null,phase:0};

function startBattle(S,kind){
  const n=S.heroes.length, B={ph:'h',turn:1,kind,units:[],obs:[],charge:0,tele:[],trial:null,ev:[],evN:0,xp:0,gold:0,done:null,seq:0};
  S.stats.fights++;
  const dep=S.mode==='arena'?S.wave:S.depth, df=DIFF[S.diff];
  // obstacles
  const on=3+rnd(3);
  for(let i=0;i<on;i++){const x=2+rnd(6),y=rnd(H);if(!B.obs.some(o=>o[0]===x&&o[1]===y))B.obs.push([x,y]);}
  // heroes
  const rows=[3,1,5,2,4,0,6];
  S.heroes.forEach((h,i)=>{const r=rows[i%rows.length],c=i<7?0:1;B.units.push(mkHeroUnit(S,h,c+(i%2),r));});
  B.units.forEach(u=>{u.x=Math.min(u.x,1);B.obs=B.obs.filter(o=>!(o[0]===u.x&&o[1]===u.y));});
  S.arts.forEach(a=>{if(ARTS[a].m.start)B.charge=Math.min(100,B.charge+ARTS[a].m.start);});
  // enemies
  const act=ACTS[Math.min(S.mode==='arena'?Math.floor(S.wave/6):S.act,2)];
  let eid=1;
  const place=()=>{for(let t=0;t<60;t++){const x=7+rnd(3),y=rnd(H);if(!blocked(B,x,y))return[x,y];}return freeNear(B,8,3,5)||[9,0];};
  const arenaBoss=S.mode==='arena'&&S.wave%5===0;
  if(kind==='boss'||arenaBoss){
    const bk=arenaBoss&&kind!=='boss'?ACTS[Math.min(2,Math.floor((S.wave-1)/5))].boss:act.boss;
    B.obs=B.obs.filter(o=>o[0]<7);
    const [bx,by]=freeNear(B,8,3,3);B.units.push(mkEnemy(S,bk,bx,by,'e'+eid++));
    B.kind='boss';
  } else {
    let budget=(4+dep*.9)*(.4+.2*n)*(kind==='elite'?1.4:1), cnt=0, pool=act.pool.slice();
    if(kind==='elite'){const t=pick(pool.filter(p=>EN[p].cost>=3));const [x,y]=place();const af=pick(Object.keys(AFFIX));
      const u=mkEnemy(S,t,x,y,'e'+eid++,af);u.hp=u.mhp=Math.round(u.hp*1.6);u.atk=Math.round(u.atk*1.25);u.elite=true;u.xp*=2;B.units.push(u);budget-=EN[t].cost;
      if(S.diff>=4){const a2=pick(Object.keys(AFFIX));}}
    while(budget>0&&cnt<7){const ok=pool.filter(p=>EN[p].cost<=budget+1);if(!ok.length)break;const t=pick(ok);const [x,y]=place();
      const af=Math.random()<df.mods*.3?pick(Object.keys(AFFIX)):null;B.units.push(mkEnemy(S,t,x,y,'e'+eid++,af));budget-=EN[t].cost;cnt++;}
    if(Math.random()<df.trial&&kind!=='boss')B.trial=pick(Object.keys(TRIALS));
  }
  if(B.trial==='barrier')B.units.forEach(u=>{if(u.team==='e')u.sh+=8+dep*2;});
  if(B.trial==='frenzy')B.units.forEach(u=>{if(u.team==='e'){u.mv++;u.mvl=u.mv;}});
  S.B=B;S.phase='battle';S.R=null;
  S.log.push(kind==='boss'?'A god stirs. The ground shudders.':kind==='elite'?'An elite blocks the path.':'Enemies close in.');
  return B;
}

/* ===== ENGINE 2: statuses, damage, abilities, movement ===== */
const NEG=['burn','poison','bleed','weak','stun','root','chill','mark'];
const alive=(B,team)=>B.units.filter(u=>!u.dead&&u.team===team);
const foesOf=(B,u)=>alive(B,u.team==='h'?'e':'h');
const alliesOf=(B,u)=>alive(B,u.team);
const armorOf=u=>u.armor+((u.st.guard&&u.st.guard.p)||0);

function addSt(B,u,name,d,p){

  if(u.dead)return false;
  d+=(u.team==='h'&&B.ph==='e')?1:0;

}
function heal(S,u,amt){
  const B=S.B;if(u.dead)return 0;

  amt=Math.round(amt);const a=Math.min(amt,u.mhp-u.hp);u.hp+=a;if(a>0)ev(B,{k:'h',id:u.id,v:a});return a;
}
function kill(S,u,src){

  if(u.team==='e'){B.xp+=u.xp||0;S.stats.kills++;
    if(u.aff==='volatile'){ev(B,{k:'t',id:u.id,s:'Explodes!'});B.units.forEach(o=>{if(!o.dead&&o.team==='h'&&cheb(o,u)<=1)dealDamage(S,null,o,14,{pierce:1,noreflect:1});});}
    if(u.boss){S.stats.bosses++;B.units.forEach(o=>{if(!o.dead&&o.team==='e')kill(S,o,src);});}}
}
function dealDamage(S,src,dst,raw,o){
  o=o||{};const B=S.B;if(dst.dead)return 0;

  if(src){if(src.st.weak)d*=.75;if(src.st.bless)d*=1.25;if(src.team==='e'&&B.trial==='bloodmoon')d*=1.25;}
  if(dst.st.mark)d*=1.5;

    let r=dst.thorns||0;if(dst.aff==='thorny')r=3;
    if(r)dealDamage(S,null,src,r,{pierce:1,noreflect:1});
    if(dst.st.counter&&!dst.dead&&dst.hp>0)dealDamage(S,dst,src,dst.atk,{noreflect:1});

function gainCharge(B,u,n){if(u.team!=='h')return;B.charge=Math.min(100,B.charge+n+(u.gain||0));}
/* ----- ability helpers ----- */
const abLvl=(S,u,id)=>{const h=S.heroes.find(x=>x.id===u.hid);return h?(h.up[id]||0):0;};
function abRange(S,u,a){
  let r=a.r;if(r>0){if(abLvl(S,u,a.id)>=2)r++;if(S.B.trial==='fog'&&u.team==='h')r=Math.max(1,r-1);}return r;
}
function abCost(S,u,a){return Math.max(1,a.ap-(abLvl(S,u,a.id)>=3&&a.ap>=2&&!a.ult?1:0));}
function abCheck(S,u,id,tx,ty){

function pushUnit(B,from,t,n){

function useAb(S,u,id,tx,ty){

    spots.sort((p,q)=>cheb(u,{x:p[0],y:p[1]})-cheb(u,{x:q[0],y:q[1]}));if(spots[0]){u.x=spots[0][0];u.y=spots[0][1];}}

function mkSummon(S,owner,type,x,y){

    mv:d.mv,mvl:d.mv,rng:d.rng,st:{},sh:0,ap:0,dead:false,ai:'melee',summon:true,thorns:0,steal:0,gain:0,onhit:[]});

function defend(S,u){
  const B=S.B;if(u.dead||u.st.stun||u.ap<1)return{ok:false,why:'Cannot defend'};
  u.ap-=1;addSt(B,u,'guard',1,3);u.sh+=Math.round(u.atk*.4);gainCharge(B,u,12);ev(B,{k:'t',id:u.id,s:'Guard'});return{ok:true};
}
function moveUnit(S,u,x,y){
  const B=S.B;if(u.dead||u.st.stun||u.st.root)return{ok:false,why:u.st.root?'Rooted':'Cannot move'};

/* ===== ENGINE 3: enemy AI, bosses, turn resolution ===== */
function nearestTile(B,u,tgt,want){
  const r=reach(B,u,u.st.root?0:u.mvl);let best=null,bs=1e9;
  for(const [k,d] of r){const [x,y]=k.split(',').map(Number);const s=Math.abs(cheb({x,y},tgt)-want)*10+d;if(s<bs){bs=s;best=[x,y,d];}}
  return best;
}
function chooseTarget(B,u,foes,mode){
  const tn=foes.filter(f=>f.st.taunt);const L=tn.length?tn:foes;
  return L.slice().sort((a,b)=>{
    if(mode==='weak')return (a.hp/a.mhp)-(b.hp/b.mhp)||cheb(u,a)-cheb(u,b);
    return cheb(u,a)-cheb(u,b)||a.hp-b.hp;})[0];
}
function eAttack(S,e,t,mult){
  const B=S.B;let raw=e.atk*mult;ev(B,{k:'c',id:e.id,n:'Attack',x:t.x,y:t.y,ab:e.rng>1?'_ranged':'_melee'});
  const d=dealDamage(S,e,t,raw,{});
  if(e.steal&&d)heal(S,e,d*e.steal);
  if(!t.dead&&e.hit)addSt(B,t,e.hit[0],e.hit[1],e.hit[2]);
}
function mkTele(B,e,cells,dmg,fx,label){
  cells=cells.filter(c=>c[0]>=0&&c[1]>=0&&c[0]<W&&c[1]<H);
  B.tele.push({cells,dmg:Math.round(dmg),fx:fx||null,by:e.id,n:label});
}
const plusCells=(x,y)=>[[x,y],[x+1,y],[x-1,y],[x,y+1],[x,y-1]];
const boxCells=(x,y,r)=>{const o=[];for(let dx=-r;dx<=r;dx++)for(let dy=-r;dy<=r;dy++)o.push([x+dx,y+dy]);return o;};
function actMelee(S,e,foes,charger){
  const B=S.B;if(!foes.length)return;
  const t=chooseTarget(B,e,foes,e.ai==='assassin'?'weak':'near');
  const d0=cheb(e,t);
  if(d0>e.rng){const m=nearestTile(B,e,t,e.rng);if(m&&m[2]>0){e.x=m[0];e.y=m[1];}}
  if(cheb(e,t)<=e.rng&&!t.dead)eAttack(S,e,t,charger&&d0>=3?1.4:1);
}
function actRanged(S,e,foes,tele){
  const B=S.B;if(!foes.length)return;
  const t=chooseTarget(B,e,foes,tele?'near':'weak');
  const r=e.st.root?new Map([[key(e.x,e.y),0]]):reach(B,e,e.mvl);
  let best=null,bs=-1e9;
  for(const [k,d] of r){const [x,y]=k.split(',').map(Number);const p={x,y};const dt=cheb(p,t);if(dt>e.rng)continue;
    const md=Math.min(...foes.map(f=>cheb(p,f)));const s=Math.min(md,3)*5-d;if(s>bs){bs=s;best=[x,y];}}
  if(!best){const m=nearestTile(B,e,t,e.rng);if(m){e.x=m[0];e.y=m[1];}}
  else{e.x=best[0];e.y=best[1];}
  if(cheb(e,t)<=e.rng){
    if(tele){mkTele(B,e,plusCells(t.x,t.y),e.atk*1.4,e.hit,e.name);ev(B,{k:'c',id:e.id,n:'Cast',x:t.x,y:t.y,ab:'_cast'});}
    else eAttack(S,e,t,1);
  }
}
function enemyAct(S,e){
  const B=S.B;if(e.dead)return;
  if(e.st.stun){ev(B,{k:'t',id:e.id,s:'Stunned'});return;}
  const foes=alive(B,'h');if(!foes.length)return;
  const ai=e.ai==='boss'?(e.rng>1?'ranged':'melee'):e.ai;
  if(ai==='healer'){
    const al=alive(B,'e').filter(x=>x.hp<x.mhp*.75).sort((a,b)=>a.hp/a.mhp-b.hp/b.mhp)[0];
    if(al&&cheb(e,al)<=e.rng+e.mv){const m=cheb(e,al)>e.rng?nearestTile(B,e,al,e.rng):null;if(m){e.x=m[0];e.y=m[1];}
      if(cheb(e,al)<=e.rng){heal(S,al,e.atk*2.5);ev(B,{k:'c',id:e.id,n:'Heal',x:al.x,y:al.y,ab:'_heal'});return;}}
    actRanged(S,e,foes,false);
  }
  else if(ai==='buffer'){
    const al=alive(B,'e').find(x=>x!==e&&!x.st.bless&&cheb(e,x)<=e.rng);
    if(al&&Math.random()<2){addSt(B,al,'bless',2,1);ev(B,{k:'c',id:e.id,n:'Bless',x:al.x,y:al.y,ab:'_bless'});}
    else actRanged(S,e,foes,false);
  }
  else if(ai==='caster')actRanged(S,e,foes,true);
  else if(ai==='ranged')actRanged(S,e,foes,false);
  else actMelee(S,e,foes,ai==='charger');
}
function allyAct(S,u){
  const B=S.B;if(u.dead||u.st.stun)return;const foes=alive(B,'e');if(!foes.length)return;
  const t=chooseTarget(B,u,foes,'near');
  if(cheb(u,t)>u.rng){const m=nearestTile(B,u,t,u.rng);if(m&&m[2]>0){u.x=m[0];u.y=m[1];}}
  if(cheb(u,t)<=u.rng){ev(B,{k:'c',id:u.id,n:'Attack',x:t.x,y:t.y,ab:'_melee'});dealDamage(S,u,t,u.atk,{});}
}
/* ----- bosses ----- */
function spawnAdds(S,b,type,n){
  const B=S.B;for(let i=0;i<n;i++){const sp=freeNear(B,b.x,b.y,3);if(!sp)continue;
    const id='e'+(100+B.units.length+i+B.turn*10);B.units.push(mkEnemy(S,type,sp[0],sp[1],id));ev(B,{k:'t',id,s:'Summoned'});}
}
function bossSpec(S,b){
  const B=S.B;if(b.dead)return;const hs=alive(B,'h');if(!hs.length)return;
  const pct=b.hp/b.mhp,T=B.turn;
  const spread=(n)=>shuffle(hs.filter(h=>h.hid)).concat(hs.filter(h=>!h.hid)).slice(0,n);
  if(b.spec==='vael'){
    if(T%2===0)spread(3).forEach(h=>mkTele(B,b,boxCells(h.x,h.y,1),b.atk*1.1,[['bleed',2,3]],'Tomb-wave'));
    if(pct<=.5&&b.phase<1){b.phase=1;b.atk=Math.round(b.atk*1.2);spawnAdds(S,b,'ghoul',2);ev(B,{k:'t',id:b.id,s:'Rise!'});}
    if(pct<=.2&&b.phase<2){b.phase=2;spawnAdds(S,b,'ghoul',2);}
  } else if(b.spec==='orrun'){
    if(T%2===1){const rows=[...new Set(spread(2).map(h=>h.y))];rows.forEach(y=>mkTele(B,b,Array.from({length:W},(_,x)=>[x,y]),b.atk*.9,[['root',1,0]],'Flood'));}
    if(pct<=.66&&b.phase<1){b.phase=1;spawnAdds(S,b,'drowned',2);ev(B,{k:'t',id:b.id,s:'Tides rise'});}
    if(pct<=.33&&b.phase<2){b.phase=2;b.atk=Math.round(b.atk*1.2);spawnAdds(S,b,'wraith',2);}
    if(T%3===0)spread(1).forEach(h=>mkTele(B,b,boxCells(h.x,h.y,1),b.atk*1.2,[['chill',2,0]],'Maelstrom'));
  } else if(b.spec==='seraphine'){
    if(T%2===1)spread(2).forEach(h=>{const c=[];for(let x=0;x<W;x++)c.push([x,h.y]);for(let y=0;y<H;y++)c.push([h.x,y]);mkTele(B,b,c,b.atk*.9,[['burn',2,4]],'Sunbeam');});
    else spread(3).forEach(h=>mkTele(B,b,boxCells(h.x,h.y,1),b.atk*1.3,null,'Judgement'));
    if(pct<=.5&&b.phase<1){b.phase=1;b.atk=Math.round(b.atk*1.3);hs.forEach(h=>addSt(B,h,'mark',2,1));ev(B,{k:'t',id:b.id,s:'Enraged'});}
    if(pct<=.25&&b.phase<2){b.phase=2;spawnAdds(S,b,'seraph',2);}
  }
}
/* ----- turn flow ----- */
function resolveTele(S){
  const B=S.B;
  for(const t of B.tele){
    for(const u of alive(B,'h')){if(!t.cells.some(c=>c[0]===u.x&&c[1]===u.y))continue;
      dealDamage(S,null,u,t.dmg,{noreflect:1});
      if(!u.dead&&t.fx)for(const f of t.fx)addSt(B,u,f[0],f[1],f[2]);}
  }
  B.tele=[];
}
function tickEnd(S){
  const B=S.B;
  for(const u of B.units){if(u.dead)continue;
    for(const n of ['burn','poison','bleed']){const s=u.st[n];if(s&&!u.dead)dealDamage(S,null,u,s.p,{pierce:1,noreflect:1});}
    if(u.st.regen&&!u.dead)heal(S,u,u.st.regen.p);
    if(B.trial==='ashfall'&&u.team==='h'&&u.hid&&!u.dead)dealDamage(S,null,u,3,{pierce:1,noreflect:1});
    if(u.dead)continue;
    for(const k of Object.keys(u.st)){u.st[k].d--;if(u.st[k].d<=0)delete u.st[k];}
  }
}
function checkEnd(S){
  const B=S.B;if(B.done)return true;
  if(!alive(B,'e').length){victory(S);return true;}
  if(!B.units.some(u=>!u.dead&&u.team==='h'&&u.hid)){defeat(S);return true;}
  return false;
}
function beginHeroPhase(S){
  const B=S.B;B.ph='h';
  for(const u of B.units){if(u.dead)continue;
    const ch=u.st.chill?2:0;u.mvl=Math.max(0,u.mv-ch);
    u.ap=u.team==='h'?(u.hid?3:0):1;
    if(u.hid&&u.st.haste)u.ap+=1;}
}
function enemyPhase(S){
  const B=S.B;B.ph='e';
  resolveTele(S);if(checkEnd(S))return;
  for(const u of B.units.filter(x=>x.summon&&!x.dead)){allyAct(S,u);if(checkEnd(S))return;}
  for(const e of B.units.filter(x=>x.team==='e'&&!x.dead)){
    enemyAct(S,e);if(checkEnd(S))return;
    if(e.boss)bossSpec(S,e);
  }
  tickEnd(S);if(checkEnd(S))return;
  B.turn++;beginHeroPhase(S);
}
function resolveTurn(S,plans){
  const B=S.B;B.ev=[];B.seq=(B.seq||0)+1;B.ph='h';
  for(const h of S.heroes){
    const u=B.units.find(x=>x.id===h.id);if(!u||u.dead)continue;
    for(const a of (plans[h.id]||[])){
      if(u.dead)break;let r;
      if(a.a==='mv')r=moveUnit(S,u,a.x,a.y);
      else if(a.a==='ab')r=useAb(S,u,a.id,a.x,a.y);
      else if(a.a==='df')r=defend(S,u);
      if(r&&!r.ok)ev(B,{k:'t',id:u.id,s:r.why});
      if(checkEnd(S))return;
    }
  }
  enemyPhase(S);
  S.rev++;
}

/* ===== ENGINE 4: rewards, levels, run flow, commands ===== */
function wpick(list){let t=list.reduce((s,x)=>s+x.w,0),r=Math.random()*t;for(const x of list){r-=x.w;if(r<=0)return x;}return list[0];}
function levelCards(S,h){
  const sub=CLS[h.cls].subs[h.sub],pool=[];
  const open=h.abs.length<5&&(h.lv===3||h.lv===6||h.lv>=9&&h.abs.length<5),lrn=open?CLS[h.cls].abs.concat(sub.abs).filter((a,i,ar)=>!h.abs.includes(a)&&ar.indexOf(a)===i):[];
  lrn.forEach(a=>pool.push({t:'learn',id:a,w:6}));
  h.abs.forEach(a=>{if((h.up[a]||0)<3)pool.push({t:'up',id:a,w:3});});
  Object.keys(BLESS).filter(b=>!h.bl.includes(b)).forEach(b=>pool.push({t:'bless',id:b,w:1.6}));
  const out=[];
  if(lrn.length){const c=wpick(pool.filter(p=>p.t==='learn'));pool.splice(pool.indexOf(c),1);out.push({t:'learn',id:c.id});}
  while(out.length<2&&pool.length){const c=wpick(pool);pool.splice(pool.indexOf(c),1);out.push({t:c.t,id:c.id});}
  out.push(Math.random()<.5?{t:'hp'}:{t:'atk'});
  return out;
}
function addXp(S,h,xp){
  h.xp+=xp;
  while(h.xp>=xpNeed(h.lv)&&h.lv<12){
    h.xp-=xpNeed(h.lv);const old=hstat(S,h).mhp;h.lv++;h.hp+=hstat(S,h).mhp-old;
    h.pend.push({cards:levelCards(S,h)});
  }
}
function applyCard(S,h,c){
  if(c.t==='learn'){if(!h.abs.includes(c.id)&&h.abs.length<5)h.abs.splice(h.abs.length-1,0,c.id);}
  else if(c.t==='up')h.up[c.id]=(h.up[c.id]||0)+1;
  else if(c.t==='bless')h.bl.push(c.id);
  else if(c.t==='hp'){h.hpb+=8;h.hp+=8;}
  else if(c.t==='atk')h.atkb+=1;
}
function victory(S){
  const B=S.B,df=DIFF[S.diff],kind=B.kind;B.done='win';
  const am=k=>S.arts.reduce((s,a)=>s+(ARTS[a].m[k]||0),0);
  const dep=S.mode==='arena'?S.wave:S.depth;
  const xp=Math.round(B.xp*(1+am('xp')));
  const gold=Math.round((14+rnd(10)+dep*2)*(kind==='boss'?3:kind==='elite'?1.8:1)*df.gold*(1+am('gold')));
  S.gold+=gold;S.depth++;
  const R={xp,gold,kind,loot:{},arts:[],artTaken:null,ready:{}};
  for(const h of S.heroes){
    const u=B.units.find(x=>x.id===h.id);
    const mhp=hstat(S,h).mhp;
    h.hp=!u||u.dead?Math.max(1,Math.ceil(mhp*.3)):Math.max(1,u.hp);
    if(am('after'))h.hp=Math.min(mhp,h.hp+Math.round(mhp*am('after')));
    addXp(S,h,xp);
    const rar=kind==='normal'?1:2;
    const ids=Object.keys(ITEMS).filter(k=>(ITEMS[k].rar||1)<=rar&&slotOpen((h.m&&h.m.rk)||1,ITEMS[k].slot));
    R.loot[h.id]=shuffle(ids).slice(0,3);
  }
  if(kind!=='normal'||Math.random()<.12)R.arts=shuffle(Object.keys(ARTS).filter(a=>!S.arts.includes(a))).slice(0,3);
  S.R=R;S.log.push('Victory. +'+gold+' gold, +'+xp+' xp.');
  if(S.mode!=='arena'&&S.ex){S.ex.cleared=1;S.ex.portal=1;S.ex.x=+(S.ex.lx-3.2).toFixed(2);S.ex.z=S.ex.lz;S.phase='explore';S.log.push('A portal tears open where the foe fell.');}else S.phase='reward';
}
function calcShards(S){
  const base=S.mode==='arena'?S.wave*4:S.depth*3;
  return Math.round(base+S.stats.kills*.4+S.stats.bosses*18+(S.over&&S.over.win?40:0));
}
function defeat(S){S.B.done='lose';S.phase='over';S.over={win:false};S.over.shards=calcShards(S);S.log.push('The party has fallen. The gods laugh.');}
function winRun(S){S.phase='over';S.over={win:true};S.over.shards=calcShards(S);S.log.push('The last god falls. The realm is yours.');}
function genShop(S){
  const ids=Object.keys(ITEMS);
  const items=shuffle(ids).slice(0,4).map(id=>({id,cost:Math.round(ITEMS[id].cost*(1+.04*S.depth))}));
  const arts=shuffle(Object.keys(ARTS).filter(a=>!S.arts.includes(a))).slice(0,1).map(id=>({id,cost:110}));
  return {items,arts,healCost:35,sold:{}};
}
function advance(S,fromShop){
  const wasBoss=S.R&&S.R.kind==='boss';
  S.R=null;S.evt=null;S.shop=null;S.B=null;S.ready={};
  if(S.mode==='arena'){
    if(!fromShop){S.wave++;if(S.wave%3===0){S.shop=genShop(S);S.phase='shop';return;}}
    else S.wave+=0;
    startBattle(S,'normal');return;
  }
  if(wasBoss){S.act++;S.step=0;S.map=null;if(S.act>=3){winRun(S);return;}}else S.step++;
  S.nodes=genNodes(S);S.phase='map';
}
function giveItem(S,h,id){
  const it=ITEMS[id],old=h.items[it.slot];
  if(old)S.gold+=Math.round(ITEMS[old].cost/2);
  h.items[it.slot]=id;
  const mhp=hstat(S,h).mhp;h.hp=Math.min(h.hp,mhp);
}
function evtApply(S,fx){
  if(fx.gold)S.gold=Math.max(0,S.gold+fx.gold);
  S.heroes.forEach(h=>{
    const mhp=hstat(S,h).mhp;
    if(fx.hpall)h.hp=Math.max(1,Math.min(mhp,h.hp+fx.hpall));
    if(fx.healp)h.hp=Math.min(mhp,h.hp+Math.round(mhp*fx.healp));
    if(fx.xp)addXp(S,h,fx.xp);
    if(fx.item)giveItem(S,h,randItem(1));});
  if(fx.art){const l=Object.keys(ARTS).filter(a=>!S.arts.includes(a));if(l.length)S.arts.push(pick(l));}
}
function pendingAny(S){return S.heroes.some(h=>h.pend.length);}
function tryAdvance(S){
  if(S.phase!=='reward'||!S.R||pendingAny(S))return;
  const uids=[...new Set(S.heroes.map(h=>h.uid))];
  if(S.solo||uids.every(u=>S.R.ready[u]))advance(S);
}
const owns=(S,uid,h)=>S.solo||h.uid===uid;
const isHost=(S,uid)=>S.solo||S.host===uid;
/* Apply one command. Returns true when state changed. */
const EXW=13.5,EXH=7.5;
function beginExplore(S,kind){
  const lx=6+rnd(5),lz=-3+rnd(7),loot=[];
  for(let i=0;i<2+rnd(2);i++)loot.push({x:-6+rnd(14)+rnd(10)/10,z:-6+rnd(13),g:12+rnd(22),got:0,t:'chest'});
  loot.push({x:-4+rnd(8),z:(rnd(2)?-1:1)*(3+rnd(3)),g:0,got:0,t:'shrine'});
  S.ex={kind,x:-12,z:rnd(5)-2,lx,lz,rad:kind==='boss'?6.8:5.2,portal:0,loot};
  S.B.units.filter(u=>u.team==='e').forEach((u,i,a)=>{const an=i/a.length*6.283+.6;u.ex=[+(lx+Math.cos(an)*(a.length>1?1.7:0)).toFixed(2),+(lz+Math.sin(an)*(a.length>1?1.7:0)).toFixed(2)];});
  S.phase='explore';S.log.push(kind==='boss'?'A great presence waits ahead.':'Something stirs beyond the ridge.');
}
function exMove(S,tx,tz){
  const E=S.ex;if(!isFinite(tx)||!isFinite(tz))return false;
  tx=Math.max(-EXW,Math.min(EXW,tx));tz=Math.max(-EXH,Math.min(EXH,tz));
  let dx=tx-E.x,dz=tz-E.z;const d=Math.hypot(dx,dz);if(d<.05)return false;if(d>7){dx=dx/d*7;dz=dz/d*7;}
  const nx=E.x+dx,nz=E.z+dz;
  for(const l of E.loot){if(l.got)continue;const t=Math.max(0,Math.min(1,((l.x-E.x)*dx+(l.z-E.z)*dz)/(dx*dx+dz*dz||1)));const px=E.x+dx*t-l.x,pz=E.z+dz*t-l.z;
    if(Math.hypot(px,pz)<1.5){l.got=1;if(l.t==='chest'){S.gold+=l.g;S.log.push('Found '+l.g+' gold.');}else{S.heroes.forEach(h=>{const m=hstat(S,h).mhp;h.hp=Math.min(m,h.hp+Math.round(m*.2));});S.log.push('A shrine mends the party.');}}}
  E.x=+nx.toFixed(2);E.z=+nz.toFixed(2);E.portal=Math.hypot(E.x-E.lx,E.z-E.lz)<E.rad?1:0;return true;
}
function applyCmd(S,uid,c){
  if(!c||!S||S.phase==='over')return false;
  const H1=id=>S.heroes.find(h=>h.id===id);
  switch(c.type){
  case 'node':{
    if(S.phase!=='map'||!isHost(S,uid))return false;const n=S.nodes[c.i];if(!n)return false;if(S.map){S.map.prev=n.j;S.map.path[S.step]=n.j;}
    if(n.k==='battle'||n.k==='elite'||n.k==='boss'){startBattle(S,n.k);beginExplore(S,n.k);}
    else if(n.k==='event'){S.evt={i:rnd(EVENTS.length)};S.phase='event';}
    else if(n.k==='rest')S.phase='rest';
    else if(n.k==='shop'){S.shop=genShop(S);S.phase='shop';}
    else if(n.k==='treasure'){
      const R={xp:0,gold:30+rnd(30),kind:'treasure',loot:{},arts:shuffle(Object.keys(ARTS).filter(a=>!S.arts.includes(a))).slice(0,3),artTaken:null,ready:{}};
      S.gold+=R.gold;for(const h of S.heroes)R.loot[h.id]=shuffle(Object.keys(ITEMS).filter(k=>slotOpen((h.m&&h.m.rk)||1,ITEMS[k].slot))).slice(0,3);S.R=R;S.phase='reward';}
    return true;}
  case 'xmove':{
    if(S.phase!=='explore'||!isHost(S,uid)||S.ex.cleared)return false;return exMove(S,+c.x,+c.z);}
  case 'abandon':{if(!isHost(S,uid)||S.phase==='over')return false;S.phase='over';S.over={win:false,abandoned:true};S.over.shards=Math.max(1,Math.round(calcShards(S)*.7));S.log.push('The party abandons the road. Some shards are salvaged.');return true;}
  case 'enter':{
    if(S.phase!=='explore'||!isHost(S,uid))return false;if(!S.ex.portal&&!c.force)return false;
    if(S.ex.cleared){S.ex=null;S.phase='reward';return true;}
    S.phase='battle';S.log.push(S.B.kind==='boss'?'You step through the portal into the god\'s domain.':'The portal swallows the party.');return true;}
  case 'evt':{
    if(S.phase!=='event'||!isHost(S,uid))return false;const e=EVENTS[S.evt.i],ch=e.c[c.i];if(!ch)return false;
    evtApply(S,ch.fx);S.log.push(e.t+': '+ch.l);
    if(pendingAny(S)){S.R={xp:0,gold:0,kind:'event',loot:{},arts:[],artTaken:null,ready:{}};S.phase='reward';}
    else advance(S);return true;}
  case 'rest':{
    if(S.phase!=='rest'||!isHost(S,uid))return false;
    S.heroes.forEach(h=>{const mhp=hstat(S,h).mhp;if(c.c==='heal')h.hp=Math.min(mhp,h.hp+Math.round(mhp*.4));else addXp(S,h,50);});
    if(pendingAny(S)){S.R={xp:0,gold:0,kind:'event',loot:{},arts:[],artTaken:null,ready:{}};S.phase='reward';}
    else advance(S);return true;}
  case 'buy':{
    if(S.phase!=='shop')return false;const sh=S.shop;
    if(c.kind==='item'){const o=sh.items.find(x=>x.id===c.id);const h=H1(c.hid);
      if(!o||!h||!owns(S,uid,h)||sh.sold[o.id]||S.gold<o.cost)return false;S.gold-=o.cost;sh.sold[o.id]=1;giveItem(S,h,o.id);return true;}
    if(c.kind==='art'){const o=sh.arts.find(x=>x.id===c.id);if(!o||sh.sold[o.id]||S.gold<o.cost)return false;S.gold-=o.cost;sh.sold[o.id]=1;S.arts.push(o.id);return true;}
    if(c.kind==='heal'){if(S.gold<sh.healCost)return false;S.gold-=sh.healCost;S.heroes.forEach(h=>{const m=hstat(S,h).mhp;h.hp=Math.min(m,h.hp+Math.round(m*.3));});return true;}
    return false;}
  case 'leave':{
    if(S.phase!=='shop'||!isHost(S,uid))return false;advance(S,S.mode==='arena');return true;}
  case 'lvl':{
    const h=H1(c.hid);if(!h||!owns(S,uid,h)||!h.pend.length)return false;const card=h.pend[0].cards[c.i];if(!card)return false;
    applyCard(S,h,card);h.pend.shift();tryAdvance(S);return true;}
  case 'claim':{
    if(S.phase!=='reward'||!S.R)return false;const h=H1(c.hid);if(!h||!owns(S,uid,h))return false;
    if(!S.R.loot[h.id]||!S.R.loot[h.id].includes(c.id))return false;giveItem(S,h,c.id);delete S.R.loot[h.id];return true;}
  case 'art':{
    if(S.phase!=='reward'||!S.R||S.R.artTaken||!S.R.arts.includes(c.id))return false;
    S.arts.push(c.id);S.R.artTaken=c.id;S.R.arts=[];
    S.heroes.forEach(h=>{h.hp=Math.min(h.hp,hstat(S,h).mhp);});return true;}
  case 'ready':{
    if(S.phase!=='reward'||!S.R)return false;S.R.ready[uid]=1;
    tryAdvance(S);return true;}
  case 'force':{
    if(S.phase!=='reward'||!isHost(S,uid))return false;advance(S);return true;}
  }
  return false;
}

/* ===== UI 1: app state, board rendering ===== */
const $=id=>document.getElementById(id);
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const App={S:null,sim:null,solo:true,uid:'local',name:'Wanderer',code:null,sel:null,mode:'move',plan:{},locked:false,rev:-1,hover:null,floats:[],

const STC={burn:'#e0884a',poison:'#7fb069',bleed:'#b3432f',stun:'#f0d98c',root:'#8a6a3f',chill:'#7fc4d6',mark:'#d9604a',weak:'#9a8cc9',guard:'#8fa3bf',
  taunt:'#c9c2a8',bless:'#ffd27a',haste:'#ffffff',regen:'#9ccc82',counter:'#a48cc9'};

function rebuildSim(){
  const S=App.S;if(!S||S.phase!=='battle'||!S.B){App.sim=null;return;}
  const sim=clone(S);sim.B.ev=[];
  for(const h of myHeroes()){const u=sim.B.units.find(x=>x.id===h.id);if(!u)continue;
    for(const a of (App.plan[h.id]||[])){if(a.a==='mv')moveUnit(sim,u,a.x,a.y);else if(a.a==='ab')useAb(sim,u,a.id,a.x,a.y);else defend(sim,u);}}

}
function dangerSet(B){
  const d=new Map();
  for(const e of B.units){if(e.dead||e.team!=='e'||e.st.stun)continue;
    const r=reach(B,e,e.st.root?0:Math.max(0,e.mv-(e.st.chill?2:0)));
    for(const k of r.keys()){const [x,y]=k.split(',').map(Number);
      for(let dx=-e.rng;dx<=e.rng;dx++)for(let dy=-e.rng;dy<=e.rng;dy++){const nx=x+dx,ny=y+dy;if(nx>=0&&ny>=0&&nx<W&&ny<H)d.set(key(nx,ny),1);}}}
  return d;
}
function rangeTiles(S,u,a){
  const out=[],r=abRange(S,u,a);if(a.t==='self')return out;
  for(let x=0;x<W;x++)for(let y=0;y<H;y++)if(cheb(u,{x,y})<=r&&!(x===u.x&&y===u.y&&a.t!=='ally'))out.push([x,y]);return out;

const Aud={ctx:null,state:null,want:null,act:0,step:0,next:0,timer:null,pad:null,

  if(this.ctx){if(this.ctx.state==='suspended')this.ctx.resume();return;}

  const nb=c.createBuffer(1,c.sampleRate,c.sampleRate),nd=nb.getChannelData(0);for(let i=0;i<nd.length;i++)nd[i]=Math.random()*2-1;this.nbuf=nb;
  this.vol();this.next=c.currentTime+.1;this.timer=setInterval(()=>this.tick(),80);
  if(this.want)this.setState(this.want,this.act);
 },
 vol(){if(!this.ctx)return;const s=App.set;this.mus.gain.value=(s.mus==null?.6:s.mus)*.55;this.sfxg.gain.value=(s.sfx==null?.8:s.sfx)*.9;this.mg.gain.value=s.mute?0:1;},

  if(this.pad){try{this.pad.g.gain.cancelScheduledValues(this.ctx.currentTime);this.pad.g.gain.setTargetAtTime(0,this.ctx.currentTime,.6);}catch(e){}this.pad=null;}},
 /* --- primitives --- */

 /* --- sfx --- */
 sfx(n,v){
  if(!this.ctx||App.set.mute||this.ctx.state!=='running')return;const c=this.ctx,t=c.currentTime+.005,T=(f,ty,d,vol,f2,dest)=>this.tone(f,ty,t,d,vol,f2,dest),N=(d,vol,ty,a,b,q)=>this.noise(t,d,vol,ty,a,b,null,q);

   case'click':T(720,'sine',.05,.12);T(1080,'sine',.04,.05);break;
   case'step':N(.06,.12,'lowpass',500,200);break;
   case'hit':N(.14,.5,'lowpass',1800,250);T(120,'sine',.18,.7,45);break;
   case'crit':N(.2,.7,'lowpass',2600,200);T(90,'sine',.3,.9,30);T(1500,'square',.05,.12);break;
   case'slash':N(.2,.4,'bandpass',3500,700,1.2);T(300,'sawtooth',.12,.07,120);break;

/* ===== cheap bloom + grading: a blurred, bright-pass copy of the frame screened over itself ===== */
const Bloom={c:null,x:null,n:0,
  tick(){

/* ===== P2P: serverless co-op. The host's browser is the server; friends connect with WebRTC. No accounts. ===== */
const P2P={
  isHost:false,code:null,hostUid:null,store:{},subs:[],gsubs:{},conns:[],gconn:null,rpc:{},rid:1,sid:1,names:{},myPres:null,peerCbs:[],peer:null,brokerOk:null,cur:null,pend:{},
  ICE:[{urls:'stun:stun.l.google.com:19302'},{urls:'stun:stun1.l.google.com:19302'}],
  uid(){let u=null;try{u=localStorage.getItem('oathless_uid');}catch(e){}if(!u){u='u'+Math.random().toString(36).slice(2,12);try{localStorage.setItem('oathless_uid',u);}catch(e){}}return u;},
  ok(){return typeof RTCPeerConnection!=='undefined';},
  /* ---- tiny helpers ---- */
  J(o){return JSON.parse(JSON.stringify(o));},
  par(p){return p.slice(0,p.lastIndexOf('/'));},
  isLocalPath(p){return p.indexOf('data/users/')===0;},
  /* ---- the db shim that net.js talks to ---- */
  db:null,
  makeDb(){
    const P=this;
    const doc=path=>({path,
      get:()=>P.opGet(path),
      set:d=>P.opWrite('set',path,d),
      update:d=>P.opWrite('upd',path,d),
      collection:n=>col(path+'/'+n),
      onSnapshot:(cb,er)=>P.sub(path,false,cb)});
    const col=path=>({path,doc:id=>doc(path+'/'+id),onSnapshot:(cb,er)=>P.sub(path,true,cb)});
    return{doc,collection:col};
  },
  snapDoc(path,raw){const d=raw&&raw.exists?raw.data:null;return{id:path.split('/').pop(),exists:!!(raw&&raw.exists),data:()=>d};},
  snapCol(raw){return{docs:(raw.docs||[]).map(x=>({id:x[0],data:()=>x[1],exists:true}))};},
  rawDoc(path){const d=this.store[path];return d?{exists:true,data:this.J(d)}:{exists:false};},
  rawCol(path){const out=[];for(const k in this.store){if(k.indexOf(path+'/')===0&&k.slice(path.length+1).indexOf('/')<0)out.push([k.slice(path.length+1),this.J(this.store[k])]);}return{docs:out};},
  async opGet(path){
    if(this.isLocalPath(path))return{exists:false,data:()=>null};
    if(this.isHost)return this.snapDoc(path,this.rawDoc(path));
    if(!this.gconn)return{exists:false,data:()=>null};
    const raw=await this.call({t:'get',path});return this.snapDoc(path,raw);
  },
  async opWrite(kind,path,data){
    if(this.isLocalPath(path))return;
    if(this.isHost){this.apply(kind,path,data);return;}
    if(!this.gconn)throw new Error('Not connected');
    this.gconn.send({t:kind,path,data});
  },
  call(m){return new Promise((res,rej)=>{const id=this.rid++;m.id=id;this.rpc[id]=res;this.gconn.send(m);setTimeout(()=>{if(this.rpc[id]){delete this.rpc[id];rej(new Error('Host did not answer'));}},9000);});},
  apply(kind,path,data){
    const d=this.J(data||{});
    this.store[path]=kind==='set'?d:Object.assign({},this.store[path]||{},d);
    this.notify(path);
  },
  notify(path){
    for(const s of this.subs.slice()){
      const hit=s.col?(this.par(path)===s.path):(path===s.path);if(!hit)continue;
      this.deliver(s);
    }
  },
  deliver(s){
    const raw=s.col?this.rawCol(s.path):this.rawDoc(s.path);
    if(s.conn){try{s.conn.send({t:'snap',sid:s.sid,col:s.col,raw});}catch(e){}}
    else setTimeout(()=>{if(this.subs.includes(s))s.cb(s.col?this.snapCol(raw):this.snapDoc(s.path,raw));},0);
  },
  sub(path,col,cb){
    if(this.isHost){const s={path,col,cb};this.subs.push(s);this.deliver(s);return()=>{this.subs=this.subs.filter(x=>x!==s);};}
    const sid=this.sid++;this.gsubs[sid]={path,col,cb};if(this.gconn)this.gconn.send({t:'sub',sid,path,col});
    return()=>{delete this.gsubs[sid];try{if(this.gconn)this.gconn.send({t:'unsub',sid});}catch(e){}};
  },
  /* ---- presence shim ---- */
  room:null,
  makeRoom(){const P=this;return{
    presence(p){P.myPres=p;if(P.isHost){P.names[p.uid]=p;P.bcastPeers();}else if(P.gconn)P.gconn.send({t:'hello',pres:p});},
    onPeers(cb){P.peerCbs.push(cb);cb({peers:P.peerList||[]});return()=>{P.peerCbs=P.peerCbs.filter(x=>x!==cb);};}};},
  bcastPeers(){

  /* ---- host side ---- */
  async startHost(code){

  addConn(c){

  hostMsg(c,m){

  },
  /* ---- transports: PeerJS broker (short code) ---- */
  loadPeerJS(){
    if(window.Peer)return Promise.resolve(true);

  cv.addEventListener('pointerdown',e=>{if(Scene.show){if(e.button===0){drag={x:e.clientX,yaw:Scene.show.yaw,show:1};Scene.show.drag=1;try{cv.setPointerCapture(e.pointerId);}catch(x){}}return;}if(e.button===2||e.button===1){drag={x:e.clientX,y:e.clientY,yaw:Scene.tyaw,pitch:R.cam.pitch};try{cv.setPointerCapture(e.pointerId);}catch(x){}}});
  cv.addEventListener('pointermove',e=>{
    if(Scene.show){if(drag&&drag.show){Scene.show.yaw=drag.yaw-(e.clientX-drag.x)*.005*App.set.cam;}return;}
    if(drag){Scene.tyaw=drag.yaw-(e.clientX-drag.x)*.006*App.set.cam;R.cam.pitch=Math.max(.45,Math.min(1.25,drag.pitch+(e.clientY-drag.y)*.004));return;}
    const p=rel(e);App.hover=Scene.ok?pickTile(p[0],p[1]):null;updInspect();});
  cv.addEventListener('pointerup',()=>{drag=null;if(Scene.show)Scene.show.drag=0;});
  cv.addEventListener('pointerleave',()=>{App.hover=null;updInspect();});
  cv.addEventListener('wheel',e=>{e.preventDefault();if(Scene.show)return;Scene.tdist=Math.max(9,Math.min(30,(Scene.tdist||17.5)+e.deltaY*.012*App.set.cam));},{passive:false});
  cv.addEventListener('click',e=>{
    const S=App.S;if(S&&S.phase==='explore'&&Scene.ok){const p=rel(e);exClick(p[0],p[1]);return;}
    if(!S||S.phase!=='battle'||!Scene.ok)return;const p=rel(e),t=pickTile(p[0],p[1]);if(!t)return;App.hover=t;
    const v=view(),u=unitAt(v.B,t.x,t.y);
    if(AB[App.mode]){addAction({a:'ab',id:App.mode,x:t.x,y:t.y});return;}
    if(u&&u.team==='h'&&u.hid){const h=S.heroes.find(x=>x.id===u.id);if(h){App.sel=u.id;render();return;}}
    if(App.mode==='move'&&App.sel)addAction({a:'mv',x:t.x,y:t.y});
  });
  document.addEventListener('keydown',hotkeys);
  window.addEventListener('resize',()=>{if(Scene.ok)R.resize();});
  document.addEventListener('mouseover',e=>{const b=e.target.closest&&e.target.closest('[data-d]');if(b&&App.S&&App.S.phase==='battle')$('hint').textContent=b.dataset.d;});
  document.addEventListener('click',e=>{
    const b=e.target.closest('button,input,[data-node]');if(!b)return;const d=b.dataset||{};
    if(d.h!==undefined&&false)return;
    if(b.id==='lock')return lockIn();
    if(b.id==='unlock'){App.locked=false;Net.unlock();render();return;}
    if(d.snd){App.set.mute=App.set.mute?0:1;saveSet();Aud.vol();render();return;}
    if(b.id==='dng'){App.danger=b.checked;return;}
    if(b.id==='forceturn'){Net.forceTurn();return;}
    if(d.m){
      if(d.m==='undo'){const a=App.plan[App.sel]||[];a.pop();rebuildSim();render();return;}
      if(d.m==='defend')return addAction({a:'df'});
      if(d.m==='move'){App.mode='move';render();return;}
      const a=AB[d.m];if(a&&a.t==='self'){addAction({a:'ab',id:d.m,x:null,y:null});return;}
      App.mode=d.m;render();return;}
    if(d.node!==undefined)return send({type:'node',i:+d.node});
    if(d.evt!==undefined)return send({type:'evt',i:+d.evt});
    if(d.rest)return send({type:'rest',c:d.rest});
    if(d.sh){App.shopHero=d.sh;render();return;}
    if(d.buy){const [k,id]=d.buy.split(':');return send({type:'buy',kind:k,id,hid:App.shopHero});}
    if(d.leave)return send({type:'leave'});
    if(d.lvl){const [hid,i]=d.lvl.split(':');return send({type:'lvl',hid,i:+i});}
    if(d.claim){const [hid,id]=d.claim.split(':');return send({type:'claim',hid,id});}
    if(d.art)return send({type:'art',id:d.art});
    if(d.ready)return send({type:'ready'});
    if(d.force)return send({type:'force'});
    if(d.again){if(App.solo){App.S=null;App.menuView='main';renderMenu();show('menu');}else Net.backToLobby();return;}
  });
  document.addEventListener('click',e=>{const c=e.target.closest('.hero,.pc');if(c&&c.dataset.h&&App.S&&App.S.phase==='battle'){const h=App.S.heroes.find(x=>x.id===c.dataset.h);if(h&&(App.solo||h.uid===App.uid)){App.sel=h.id;App.mode='move';render();}else if(h){App.sel=h.id;render();}}});
}

    r.querySelectorAll('[data-psub]').forEach(b=>b.onclick=()=>{if(+b.dataset.lk){alert('Reach Oath Rank '+b.dataset.lk+' to unlock this subclass. Rank up by finishing runs.');return;}get().sub=b.dataset.psub;set();});};
  if(App.solo){
    const sl=App.pickSlot||0,p=App.soloPick[sl];setBg([p.cls],0,'pick');
    r.innerHTML='<div class="pick"><div class="lt"><div class="pa"><h2>Choose your heroes</h2><div class="slots">'+App.soloPick.map((x,i)=>'<button class="slot'+(i===sl?' on':'')+'" style="--c:'+CLS[x.cls].col+'" data-slot="'+i+'">Hero '+(i+1)+' · '+esc(CLS[x.cls].n)+'</button>').join('')+'</div></div><div></div>'+
     '<div class="pa" style="display:grid;gap:12px">'+roster(p.cls)+'<div class="row" style="justify-content:center"><button class="btn" id="back">← Back</button><button class="btn primary big" id="go" style="width:auto;padding-inline:40px">Begin the run</button></div></div></div>'+infoPanel(p,'Hero '+(sl+1))+'</div>';
    r.querySelectorAll('[data-slot]').forEach(b=>b.onclick=()=>{App.pickSlot=+b.dataset.slot;renderRoom();});
    wire(()=>App.soloPick[sl],renderRoom);
    $('back').onclick=()=>{App.solo=false;renderMenu();};
    $('go').onclick=()=>Story.load(()=>{const S=newRun({code:'SOLO',host:'local',mode:App.pickMode||'adventure',diff:App.pickDiff||2,
      pl:App.soloPick.map((p,i)=>({uid:'local',name:CLS[p.cls].n,cls:p.cls,sub:p.sub,meta:(metaRank(),App.meta.ranks)}))});S.solo=true;App.S=S;App.sel=S.heroes[0].id;App.mode='move';afterSolo();},1100,'The road to Oathbreak');
    Aud.setState('menu');show('room');return;}
  const me=Net.me||{},run=Net.run||{},host=Net.isHost();
  const ids=Object.keys(App.players).sort((a,b)=>(App.players[a].at||0)-(App.players[b].at||0));
  if(!me.cls&&Net.me){Net.me.cls='knight';Net.me.sub='oathkeeper';Net.savePlayer({});}
  setBg([me.cls||'knight'],0,'pick');
  r.innerHTML='<div class="pick"><div class="lt"><div class="pa"><h2>Run '+esc(App.code)+'</h2><div class="note">'+(run.mode==='arena'?'Endless Arena':'Roguelike Adventure')+' · '+(DIFF[run.diff]?DIFF[run.diff].n:'')+' · share the code <b class="gold">'+esc(App.code)+'</b> or use the invite panel</div></div><div></div>'+
   '<div class="pa" style="display:grid;gap:12px"><div class="lobby">'+ids.map(u=>{const p=App.players[u],on=u===App.uid||App.peers.includes(u);return '<div class="plr"><i class="dot '+(on?'on':'')+'"></i><b>'+esc(p.name)+'</b>'+(u===run.host?' <span class="tag">host</span>':'')+
     '<span class="dim">'+(p.cls?esc(CLS[p.cls].n+' · '+CLS[p.cls].subs[p.sub].n):'choosing')+'</span>'+(p.ready?' <span class="gold">ready ✓</span>':'')+'</div>';}).join('')+'</div>'+
   (me.cls?roster(me.cls):'')+'<div class="row" style="justify-content:center"><button class="btn" id="leave">Leave</button><button class="btn'+(me.ready?' sel':'')+'" id="rdy">'+(me.ready?'Not ready':'Ready')+'</button>'+
   (host?'<button class="btn primary big" id="begin" style="width:auto;padding-inline:36px"'+(ids.length&&ids.every(u=>App.players[u].ready||u===App.uid)?'':' disabled')+'>Begin the run</button>':'<span class="note">Waiting for the host to begin.</span>')+(Net.hostGone()?'<button class="btn" id="take">Host left: take over</button>':'')+'</div></div></div>'+(me.cls?infoPanel(me,'Your hero'):'')+'</div>';
  wire(()=>Net.me,()=>{Net.savePlayer({ready:false});renderRoom();});
  $('rdy').onclick=()=>Net.savePlayer({ready:!me.ready});
  $('leave').onclick=()=>{Net.disconnect();App.S=null;App.menuView='main';renderMenu();};
  P2P.panelShow(host);
  if(host)$('begin').onclick=()=>Net.startRun();
  if($('take'))$('take').onclick=()=>Net.takeover();
  Aud.setState('menu');show('room');
}
(async function boot(){
  bindInput();initScene();
  App.canCoop=false;renderMenu();
  await Net.init();
  renderMenu();
})();

document.addEventListener('click',e=>{const h=e.target.closest&&e.target.closest('.pick .info .ihead');if(h)h.parentNode.classList.toggle('open')});

/* ===== pause menu ===== */
function pauseOpen(){
  const S=App.S;if(!S)return;let o=$('pausov');if(!o){o=document.createElement('div');o.id='pausov';document.body.appendChild(o);}
  const hs=S.heroes,sh=Math.max(1,Math.round(calcShards(S)*.7));
  o.innerHTML='<div class="shbox pa pbox"><button class="btn x" id="pclose" aria-label="Resume">✕</button><h2>Paused</h2>'+
   '<div class="oaths">'+hs.map(h=>{const c=CLS[h.cls],L=LORE[h.cls]||{};return '<div class="oath" style="--c:'+c.col+'"><div class="ipor" style="--c:'+c.col+'">'+c.g+'</div><div><b>'+esc(L.name||h.name)+'</b> <span class="dim">'+esc(c.n)+' · '+esc(c.subs[h.sub].n)+' · Lv '+h.lv+'</span><i>'+esc(L.quote||'')+'</i><span class="dim">Oath: '+esc((SUBLORE[h.sub]||'').replace(/^Vow:\s*/,''))+'</span></div></div>';}).join('')+'</div>'+
   '<div class="row" style="justify-content:center;flex-wrap:wrap;gap:8px"><button class="btn primary" id="presume">Resume</button><button class="btn" id="pbag">Backpack</button><button class="btn" id="psnd">Sound: '+(App.set.mute?'Off':'On')+'</button>'+(App.solo?'<button class="btn" id="pquit">Save &amp; Exit to Menu</button>':'')+'<button class="btn" id="pabn" style="border-color:#d9604a">Abandon Run (+'+sh+' shards)</button></div>'+
   '<div class="note" style="text-align:center">Abandoning ends this run but keeps 70% of the shards and rank xp you earned.</div></div>';
  o.hidden=false;const close=()=>{o.hidden=true;};
  $('pclose').onclick=close;$('presume').onclick=close;$('pbag').onclick=()=>{close();sheetOpen();};
  $('psnd').onclick=()=>{App.set.mute=App.set.mute?0:1;try{Aud.apply&&Aud.apply();}catch(e){}pauseOpen();};
  if($('pquit'))$('pquit').onclick=()=>{close();try{Save.run(App.S);}catch(e){}App.S=null;App.solo=false;App.menuView='main';renderMenu();};
  $('pabn').onclick=()=>{if(!confirm('Abandon this run? You keep 70% of your shards.'))return;close();send({type:'abandon'});};
}
document.addEventListener('keydown',e=>{if((e.key==='p'||e.key==='P')&&App.S&&document.body.classList.contains('ingame')&&!/INPUT|TEXTAREA/.test((e.target||{}).tagName||'')){const o=$('pausov');if(o&&!o.hidden)o.hidden=true;else pauseOpen();}});

</script>
